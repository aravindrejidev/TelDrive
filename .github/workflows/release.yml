name: Release APK

# Manual only. Nothing builds on push or pull request.
#
# To publish a release:
#   1. Edit RELEASE_NOTES.md (repo root) and commit it.
#   2. Actions -> "Release APK" -> Run workflow.
#   3. Type the version number (for example 1.3.0) and run.
#
# The workflow builds a signed APK, then publishes it as a GitHub Release with
# RELEASE_NOTES.md as the description. Installed copies of the app find that
# release on their own and offer the update.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, digits only (example: 1.3.0)'
        required: true
        type: string
      notes_file:
        description: 'Release notes file in the repository root'
        required: false
        default: 'RELEASE_NOTES.md'
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NOTES_FILE: ${{ inputs.notes_file }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check the version and release notes
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.3.0 (digits and dots, no leading v). You entered: $VERSION"
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [ "$((10#$MINOR))" -gt 99 ] || [ "$((10#$PATCH))" -gt 99 ]; then
            echo "::error::The minor and patch numbers must each be 99 or less."
            exit 1
          fi

          # Android needs a build number that always goes up. Deriving it from
          # the version keeps it in step with what you type: 1.3.0 -> 10300.
          BUILD_NUMBER=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          case "$NOTES_FILE" in
            /*|*..*)
              echo "::error::The notes file must be a path inside the repository."
              exit 1
              ;;
          esac
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::Release notes file '$NOTES_FILE' is missing or empty. Write what changed in it, commit, and run again."
            exit 1
          fi

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for v$VERSION already exists. Use a higher version number."
            exit 1
          fi

          echo "Releasing v$VERSION (build number $BUILD_NUMBER)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Android only installs an APK over an existing app when both were
          # signed with the SAME key. Without a keystore the build falls back
          # to a throwaway debug key that changes on every run, and no phone
          # could ever update to that release. So refuse to continue.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables > Actions. See 'Publishing a release' in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "Release signing configured."

      # The Telegram token is deliberately NOT passed here (the old workflow
      # could). This APK is a public download, and anything compiled into it
      # can be read back out. GITHUB_REPO is not a secret: it just tells the
      # app which repository to check for new releases.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=GITHUB_REPO="$GITHUB_REPOSITORY"

      - name: Prepare release files
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/TeleDrive-v$VERSION.apk"
          cd release
          sha256sum "TeleDrive-v$VERSION.apk" > "TeleDrive-v$VERSION.apk.sha256"
          cat "TeleDrive-v$VERSION.apk.sha256"

      - name: Publish GitHub Release
        run: |
          gh release create "v$VERSION" \
            "release/TeleDrive-v$VERSION.apk" \
            "release/TeleDrive-v$VERSION.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TeleDrive v$VERSION" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Summary
        run: |
          {
            echo "## TeleDrive v$VERSION published"
            echo
            echo "- Build number: \`$BUILD_NUMBER\`"
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
            echo "- SHA-256: \`$(cut -d' ' -f1 "release/TeleDrive-v$VERSION.apk.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"
